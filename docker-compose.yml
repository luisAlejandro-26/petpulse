services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: petpulse-oracle-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: PetPulse2024
      APP_USER: petpulse
      APP_USER_PASSWORD: PetPulse2024
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - petpulse-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  db-init:
    image: gvenzl/oracle-free:latest
    container_name: petpulse-db-init
    depends_on:
      oracle-db:
        condition: service_healthy
    volumes:
      - ./database/init.sql:/tmp/init.sql
    entrypoint: ["bash", "-c", "echo 'Running init.sql...' && sqlplus -s 'petpulse/PetPulse2024@//oracle-db:1521/FREEPDB1' @/tmp/init.sql && echo 'Tables created!'"]
    networks:
      - petpulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    container_name: petpulse-backend
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - petpulse-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    profiles:
      - production
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petpulse-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - petpulse-network

networks:
  petpulse-network:
    driver: bridge

volumes:
  oracle-data:
